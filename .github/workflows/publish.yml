name: Publish

# Stages the three packages on npm with provenance, via npm's OIDC "trusted
# publishing" (no NPM_TOKEN secret). Nothing goes live until a maintainer
# approves each staged version on npmjs.com with 2FA, so a compromised
# workflow or GitHub token can't publish on its own.
#
# One-time setup per package on npmjs.com (Settings → Trusted Publisher →
# GitHub Actions): organization `omniship-labs`, repository
# `eyeread.in-packs-sdk`, workflow `publish.yml`, no environment, and
# "Allow npm publish" left unchecked (staged publishing only). Once per
# package: create-eyeread.in-packs, eyeread.in-packs, eyeread.in-packs-types.
#
# To release: bump every package to the same version, commit, and push a
# `vX.Y.Z` tag. The `check-tag-version` step refuses a mismatch. Then approve
# the three staged versions on npmjs.com (or `npm stage list` and
# `npm stage approve <stage-id>`).
#
# workflow_dispatch re-runs a release that failed partway; staging a version
# that's already published fails harmlessly for that package.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    strategy:
      matrix:
        package:
          - create-eyeread.in-packs
          - eyeread.in-packs
          - eyeread.in-packs-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 12.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:spec
      - name: Check every package is at the tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_VERSION: ${{ github.ref_name }} # strip the leading "v" below
        run: TAG_VERSION="${TAG_VERSION#v}" node scripts/check-tag-version.js
      - name: Stage ${{ matrix.package }}
        run: npm stage publish --workspace packages/${{ matrix.package }} --access public --provenance
